<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 20px Arial, Helvetica, sans-serif; fill: #173F73; }
      .label { font: 700 16px Arial, Helvetica, sans-serif; fill: #173F73; }
      .small { font: 400 13px Arial, Helvetica, sans-serif; fill: #5B6B7F; }
      .bullet { font: 700 16px Arial, Helvetica, sans-serif; fill: #173F73; }
      .body { font: 400 15px Arial, Helvetica, sans-serif; fill: #4A5C6E; }
      .town { font: 700 15px Arial, Helvetica, sans-serif; fill: #173F73; }
      .road { stroke: #A9C7D9; stroke-width: 10; stroke-linecap: round; opacity: 0.7; }
      .minor-road { stroke: #B9CFDB; stroke-width: 6; stroke-linecap: round; opacity: 0.7; }
    </style>
  </defs>

  <!-- Outer card -->
  <rect x="20" y="20" width="1160" height="720" rx="28" fill="#EEF4F8" stroke="#D9E6EF" stroke-width="2"></rect>

  <!-- Map panel -->
  <rect x="70" y="120" width="640" height="540" rx="22" fill="#EAF1F5" stroke="#C9D9E5" stroke-width="2"></rect>

  <!-- Info panel -->
  <rect x="760" y="120" width="330" height="540" rx="22" fill="#F6FAFC" stroke="#C9D9E5" stroke-width="2"></rect>

  <!-- Stylized roads -->
  <path d="M385 110 C360 180, 355 290, 370 410 C382 500, 392 575, 405 650" class="road"></path>
  <path d="M490 140 C470 230, 455 325, 455 440 C455 515, 448 585, 440 645" class="minor-road"></path>
  <path d="M190 330 C285 320, 375 315, 500 315 C580 315, 620 322, 675 332" class="minor-road"></path>
  <path d="M235 435 C300 410, 390 400, 520 398 C590 398, 640 405, 690 415" class="minor-road"></path>

  <!-- Highway labels -->
  <text x="415" y="170" class="small">I-5</text>
  <text x="505" y="200" class="small">I-205</text>

  <!-- Service area -->
  <ellipse cx="430" cy="355" rx="200" ry="145" fill="#CFE8D5" fill-opacity="0.68" stroke="#3E8B63" stroke-width="4"></ellipse>

  <!-- Town dots -->
  <!-- Wilsonville -->
  <circle cx="405" cy="385" r="18" fill="#3E8B63"></circle>
  <circle cx="405" cy="385" r="8" fill="white"></circle>
  <text x="435" y="392" class="town">Wilsonville</text>

  <!-- Tualatin -->
  <circle cx="390" cy="280" r="16" fill="#3E8B63"></circle>
  <circle cx="390" cy="280" r="7" fill="white"></circle>
  <text x="420" y="286" class="town">Tualatin</text>

  <!-- Sherwood -->
  <circle cx="295" cy="340" r="16" fill="#3E8B63"></circle>
  <circle cx="295" cy="340" r="7" fill="white"></circle>
  <text x="210" y="346" class="town">Sherwood</text>

  <!-- Canby -->
  <circle cx="470" cy="500" r="16" fill="#3E8B63"></circle>
  <circle cx="470" cy="500" r="7" fill="white"></circle>
  <text x="500" y="506" class="town">Canby</text>

  <!-- Tigard -->
  <circle cx="375" cy="220" r="12" fill="#3E8B63"></circle>
  <circle cx="375" cy="220" r="5" fill="white"></circle>
  <text x="295" y="225" class="town">Tigard</text>

  <!-- Center ring around service region -->
  <circle cx="430" cy="355" r="6" fill="#173F73"></circle>

  <!-- Small town notes -->
  <text x="250" y="595" class="body">Serving Wilsonville, Tualatin, Sherwood,</text>
  <text x="280" y="617" class="body">Canby, Tigard, and nearby communities</text>

  <!-- Info panel header -->
  <text x="790" y="165" class="title">Local in-home help</text>
  <text x="790" y="195" class="small">Patient support for:</text>

  <!-- Bullets -->
  <text x="795" y="245" class="bullet">✓ Wi-Fi &amp; internet</text>
  <text x="795" y="290" class="bullet">✓ Printers &amp; devices</text>
  <text x="795" y="335" class="bullet">✓ Phones &amp; tablets</text>
  <text x="795" y="380" class="bullet">✓ TV &amp; streaming</text>
  <text x="795" y="425" class="bullet">✓ Smart devices</text>
  <text x="795" y="470" class="bullet">✓ Family tech care</text>

  <!-- Callout box -->
  <rect x="790" y="525" width="270" height="95" rx="18" fill="#FFF7E8" stroke="#F2C46D" stroke-width="2"></rect>
  <text x="815" y="560" class="title" style="font-size:18px;">Need help in this area?</text>
  <text x="815" y="590" class="body">Start with a call or use the website</text>
  <text x="815" y="612" class="body">to request help.</text>
</svg>